[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

[[redirects]]
  from = "/05-routing/*"
  to = "/06-routing/:splat"
  status = 301

[[redirects]]
  from = "/06-nat/*"
  to = "/07-nat/:splat"
  status = 301

[[redirects]]
  from = "/07-transport/*"
  to = "/08-transport/:splat"
  status = 301

[[redirects]]
  from = "/08-dhcp/*"
  to = "/09-dhcp/:splat"
  status = 301

[[redirects]]
  from = "/09-dns/*"
  to = "/10-dns/:splat"
  status = 301

[[redirects]]
  from = "/10-http-tls/*"
  to = "/11-http-tls/:splat"
  status = 301

[[redirects]]
  from = "/11-filtering/*"
  to = "/12-filtering/:splat"
  status = 301

[[redirects]]
  from = "/12-proxies-load-balancers/*"
  to = "/13-proxies-load-balancers/:splat"
